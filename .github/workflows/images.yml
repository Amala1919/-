name: Fetch Wikimedia images

# Downloads freely licensed lead images (Wikimedia Commons) for the titles listed in
# scripts/images.json and commits them to the branch. See scripts/fetch_images.py.
on:
  push:
    paths:
      - scripts/images.json
      - scripts/fetch_images.py
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python scripts/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add web/public/img web/src/data/image-credits.json scripts/images-report.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fetch Wikimedia Commons images"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
