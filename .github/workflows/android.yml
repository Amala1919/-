name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Same command-line build used to produce dist/ChronoAtlas.apk
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Android command-line tools (Ubuntu packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner dalvik-exchange zipalign android-sdk-platform-23
      - run: npm ci
        working-directory: web
      - run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChronoAtlas-apk
          path: dist/ChronoAtlas.apk

  # Standard Android Studio / Gradle build
  gradle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
        working-directory: web
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ChronoAtlas-gradle-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
