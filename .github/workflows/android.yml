name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Same command-line build used to produce dist/ChronoAtlas.apk
  cli:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Android command-line tools (Ubuntu packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner dalvik-exchange zipalign android-sdk-platform-23
      - run: npm ci
        working-directory: web
      - run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChronoAtlas-apk
          path: dist/ChronoAtlas.apk
      # One release per app version (never overwritten, so a download in progress can't break).
      # Stable link to the newest one: .../releases/latest/download/ChronoAtlas.apk
      - name: Read app version
        if: github.event_name == 'push'
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        if: github.event_name == 'push'
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish APK as a GitHub Release
        if: github.event_name == 'push' && steps.exists.outputs.yes == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: クロノアトラス ${{ steps.ver.outputs.name }}
          make_latest: true
          files: dist/ChronoAtlas.apk
          body: |
            Android 用 APK です。スマホで ChronoAtlas.apk をダウンロードして開くとインストールできます。
            高画質の写真はインターネット接続時に読み込みます（オフラインでは小さい写真を表示）。
      - name: Remove the old auto-updated release
        if: github.event_name == 'push' && steps.exists.outputs.yes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true

  # Standard Android Studio / Gradle build
  gradle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
        working-directory: web
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ChronoAtlas-gradle-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
