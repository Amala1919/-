<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e1424">
  <title>クロノアトラス</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="splash">
    <div class="splash-logo">
      <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
        <defs><linearGradient id="sg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f2b33d"/><stop offset="1" stop-color="#e8445a"/></linearGradient></defs>
        <circle cx="60" cy="60" r="44" fill="#16345a" stroke="url(#sg)" stroke-width="5"/>
        <path d="M24,52 Q40,40 56,50 T92,46 M22,70 Q44,60 62,72 T98,66" stroke="#c9b994" stroke-width="7" fill="none" stroke-linecap="round" opacity=".8"/>
        <g class="splash-hand"><line x1="60" y1="60" x2="60" y2="26" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
        <line x1="60" y1="60" x2="80" y2="60" stroke="#f2b33d" stroke-width="4" stroke-linecap="round"/>
        <circle cx="60" cy="60" r="5" fill="#fff"/>
      </svg>
      <div class="splash-title">クロノ<span>アトラス</span></div>
      <div class="splash-sub">国と時代をめぐる歴史の旅</div>
    </div>
  </div>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
